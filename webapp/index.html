<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جهان رزمی — وب‌اپ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/style.css">
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="brand">⚔️ جهان رزمی</div>
    <div class="hero-sub" id="heroSub">وب‌اپ رسمی ربات</div>
    <div class="hero-actions"><button class="iconbtn" onclick="refreshAll()" title="بروزرسانی">↻</button></div>
  </header>
  <div id="toast" class="toast"></div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="home">🏠 خانه</button>
    <button class="tab" data-tab="world">🗺️ جهان</button>
    <button class="tab" data-tab="sect">🏯 فرقه</button>
    <button class="tab" data-tab="characters">🎭 کاراکتر</button>
    <button class="tab" data-tab="shop">🛒 فروشگاه</button>
    <button class="tab" data-tab="chests">🎁 گنجینه</button>
    <button class="tab" data-tab="arena">⚔️ رتبه</button>
    <button class="tab" data-tab="games">🎮 بازی</button>
    <button class="tab staff-only" data-tab="admin" hidden>🛡️ مدیریت</button>
  </nav>
  <main id="view"><div class="loading">در حال بارگذاری…</div></main>
  <footer>نسخه وب متصل به همان دیتابیس و منطق ربات · بدون عکس رندوم</footer>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
try { tg?.setHeaderColor?.('#0b1020'); tg?.setBackgroundColor?.('#070b14'); } catch(e){}
const tgUser = tg?.initDataUnsafe?.user || null;
const tgId = tgUser?.id || null;
const initData = tg?.initData || '';
const $ = s => document.querySelector(s);
const view = $('#view');
const esc = v => { const d=document.createElement('div'); d.textContent=v??''; return d.innerHTML; };
function toast(msg, ok=true){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+(ok?'ok':'bad');
  clearTimeout(window._toast); window._toast=setTimeout(()=>t.className='toast', 2800);
}
async function api(path, opts={}){
  const headers = {'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(opts.headers||{})};
  let url = path;
  if (tgId) url += (path.includes('?')?'&':'?') + 'tg_id=' + encodeURIComponent(tgId);
  const r = await fetch(url, {...opts, headers});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error(j.error||j.msg||('خطا '+r.status));
  return j;
}
function card(title, body){ return `<div class="card"><h2>${title}</h2>${body}</div>`; }
function row(a,b){ return `<div class="statrow"><span class="muted">${esc(a)}</span><span>${esc(b)}</span></div>`; }
function button(label, onClick, cls=''){ return `<button class="btn ${cls}" onclick="${onClick}">${label}</button>`; }
function walletName(k){
  return ({coins:'سکه',spirit_stones:'سنگ روحی',heavenly_stones:'سنگ بهشتی',celestial_stones:'سنگ آسمانی',god_stones:'سنگ خدا',chaos_stones:'سنگ هرج‌ومرج',void_stones:'سنگ پوچی',origin_stones:'سنگ ازلی',karma_points:'کارما',destiny_stones:'سنگ تقدیر',immortal_stones:'سنگ جاودان',creation_stones:'سنگ خلقت',absolute_stones:'سنگ مطلق',faith_stones:'سنگ ایمان',dragon_coins:'سکه اژدها',eternal_ink:'جوهر ازلی'}[k]||k);
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.tab);
  });
});
function setTab(name){
  const btn = document.querySelector(`.tab[data-tab="${name}"]`);
  if(btn) btn.click();
}
async function refreshAll(){
  const active = $('.tab.active')?.dataset.tab || 'home';
  await render(active);
}

async function render(tab){
  view.innerHTML = '<div class="loading">در حال بارگذاری…</div>';
  try {
    if(tab==='home') await home();
    else if(tab==='world') await world();
    else if(tab==='sect') await sect();
    else if(tab==='characters') await characters();
    else if(tab==='shop') await shop();
    else if(tab==='chests') await chests();
    else if(tab==='arena') await arena();
    else if(tab==='games') await games();
    else if(tab==='admin') await admin();
  } catch(e){
    view.innerHTML = `<div class="card"><div class="empty">⚠️ ${esc(e.message||e)}<br><br>اگر از تلگرام باز نکردی، اول ربات را /start کن.</div></div>`;
  }
}

async function home(){
  const d = await api('/api/dashboard');
  const c = d.cultivation || {};
  const w = d.wallet || {};
  const walletRows = Object.entries(w).filter(([k,v])=>Number(v||0)!==0)
    .map(([k,v])=>row(walletName(k), Number(v).toLocaleString('fa-IR'))).join('') || row('سکه','0');
  view.innerHTML = `
    <div class="hero-card">
      <div class="avatar">${esc((d.full_name||'پ')[0])}</div>
      <div>
        <h1>${esc(d.full_name||'بازیکن')}</h1>
        <p>${esc(d.rank||'-')} · Lv.${d.level||1} · ${esc(c.realm||'بیداری')}</p>
      </div>
      <div class="power">⚡ ${Number(d.power||0).toLocaleString('fa-IR')}</div>
    </div>
    ${card('📊 وضعیت',
      row('تذهیب', `${c.realm||'-'} · مرحله ${c.stage||1}`) +
      row('انرژی', Number(c.energy||0).toLocaleString('fa-IR')) +
      row('فرقه', d.sect||'آزاد') +
      row('جهان', d.world||'-') +
      row('آسمان', d.sky||1) +
      row('مختصات', `(${d.world_x||0}, ${d.world_y||0})`) +
      row('🍖 گرسنگی', `${d.hunger??0}%`) +
      row('💧 تشنگی', `${d.thirst??0}%`)
    )}
    ${card('💰 کیف پول', walletRows)}
    <div class="quick">
      ${button('🎁 روزانه', "claimDaily()")}
      ${button('🗺️ جهان', "setTab('world')", 'secondary')}
      ${button('🎭 کاراکتر', "setTab('characters')", 'secondary')}
      ${button('🛒 فروشگاه', "setTab('shop')", 'secondary')}
    </div>`;
  // staff tab
  if(d.role==='رهبر' || d.role==='ادمین' || (d.rank||'').includes('ادمین')){
    document.querySelectorAll('.staff-only').forEach(el=>el.hidden=false);
  }
}

async function claimDaily(){
  try{
    const r = await api('/api/daily');
    toast(r.msg || (r.ok?'پاداش گرفته شد':'قبلاً گرفتی'), !!r.ok);
    await home();
  }catch(e){ toast(e.message,false); }
}

async function world(){
  const d = await api('/api/world');
  const radiusX=8, radiusY=5;
  const types=['grass','forest','mountain','desert','swamp','coast','sea','ruins'];
  const emoji={grass:'🌿',forest:'🌲',mountain:'⛰️',desert:'🏜️',swamp:'🪷',coast:'🌊',sea:'🌊',ruins:'🏚️',ice:'❄️',frontier:'🗿'};
  let cells='';
  for(let dy=radiusY; dy>=-radiusY; dy--){
    for(let dx=-radiusX; dx<=radiusX; dx++){
      const x=(d.x||0)+dx, y=(d.y||0)+dy;
      const seed=Math.abs(x*92821+y*68917+(d.sky||1)*31337);
      let code=types[seed%types.length];
      if(Math.abs(y)>=18) code='ice';
      else if(Math.abs(x)>=28 && Math.abs(y)<18) code='frontier';
      const city=(d.cities||[]).find(c=>c.x===x&&c.y===y);
      const isMe=dx===0&&dy===0;
      const mark = isMe ? '🧍' : (city ? '🏰' : (emoji[code]||'·'));
      cells += `<div class="geo-cell ${code}${isMe?' me':''}" title="(${x},${y})">${mark}</div>`;
    }
  }
  const boss = d.boss ? `<div class="list-item"><span>👹 ${esc(d.boss.name||'باس')}</span><span class="badge">${esc(d.boss.hp||'')}</span></div>` : '';
  const ev = d.event ? `<div class="list-item"><span>📣 ${esc(d.event.title||d.event)}</span></div>` : '';
  view.innerHTML = `
    ${card('🗺️ نقشه اطراف', `<div class="geo-map">${cells}</div>
      <div class="statrow"><span class="muted">موقعیت</span><span>(${d.x||0}, ${d.y||0}) · آسمان ${d.sky||1}</span></div>
      <div class="statrow"><span class="muted">شهر</span><span>${esc(d.city||'-')}</span></div>`)}
    ${card('رویداد / باس', boss+ev || '<div class="empty">رویداد فعالی نیست</div>')}
    <div class="actions">
      ${button('⬆️', "moveWorld(0,1)", 'secondary')}
      ${button('⬇️', "moveWorld(0,-1)", 'secondary')}
      ${button('➡️', "moveWorld(1,0)", 'secondary')}
      ${button('⬅️', "moveWorld(-1,0)", 'secondary')}
    </div>`;
}

async function moveWorld(dx,dy){
  try{
    const r = await api('/api/action',{method:'POST',body:JSON.stringify({action:'move',dx,dy})});
    toast(r.msg||'حرکت انجام شد');
    await world();
  }catch(e){ toast(e.message,false); }
}

async function sect(){
  let d;
  try{ d = await api('/api/sect'); }catch(e){ d = null; }
  const list = await api('/api/sects').catch(()=>({sects:[]}));
  const mine = d && !d.error ? `
    ${card('فرقه من',
      row('نام', d.name||'-') +
      row('رتبه من', d.my_rank||'-') +
      row('اعضا', d.members_count||'-') +
      row('قدرت', d.power||'-')
    )}` : card('فرقه من','<div class="empty">هنوز عضو فرقه‌ای نیستی. از ربات /sects بزن.</div>');
  const rows = (list.sects||list||[]).slice(0,15).map(s=>{
    const name = s.name||s[0]||'-';
    const power = s.power||s[1]||'';
    return `<div class="list-item"><span>${esc(name)}</span><span class="badge">${esc(power)}</span></div>`;
  }).join('') || '<div class="empty">فرقه‌ای ثبت نشده</div>';
  view.innerHTML = mine + card('🏯 فرقه‌های برتر', rows);
}

async function characters(){
  const d = await api('/api/characters');
  const owned = d.owned || d.characters || [];
  const rows = owned.slice(0,30).map((c,i)=>`
    <div class="list-item">
      <span>#${i+1} ${esc(c.name||c)} <span class="badge">${esc(c.rarity||'')}</span></span>
      <span class="badge gold">⚔ ${esc(c.power||c.bonus||'')}</span>
    </div>`).join('') || '<div class="empty">کاراکتری نداری. در ربات /pullchar بزن.</div>';
  view.innerHTML = card('🎭 کاراکترهای من', rows) +
    `<div class="actions">${button('بروزرسانی', "characters()")}</div>`;
}

async function shop(){
  const d = await api('/api/shop');
  const items = d.items || d.shop || [];
  const rows = items.slice(0,40).map(it=>`
    <div class="list-item">
      <span>${esc(it.name||it.title||'آیتم')} <span class="muted">${esc(it.item_type||'')}</span></span>
      <span class="badge gold">${Number(it.price||it.cost||0).toLocaleString('fa-IR')}</span>
    </div>`).join('') || '<div class="empty">فروشگاه خالی است یا از ربات /shop استفاده کن.</div>';
  view.innerHTML = card('🛒 فروشگاه', rows) +
    card('💡 نکته', '<div class="muted">خرید قطعی از داخل ربات انجام می‌شود. اینجا فقط مشاهده است.</div>');
}

async function chests(){
  const d = await api('/api/chests').catch(()=>({}));
  const list = d.chests || d.items || [];
  const rows = list.map(c=>`
    <div class="list-item">
      <span>${esc(c.name||c.title||'صندوق')}</span>
      <span class="badge">${esc(c.price||c.cost||'—')}</span>
    </div>`).join('') || '<div class="empty">برای صندوق روزانه از دکمه خانه استفاده کن یا در ربات /daily بزن.</div>';
  view.innerHTML = card('🎁 گنجینه و صندوق', rows) +
    `<div class="actions">${button('🎁 پاداش روزانه', "claimDaily()")}</div>`;
}

async function arena(){
  const rank = await api('/api/ranking').catch(()=>({players:[]}));
  const arena = await api('/api/arena').catch(()=>({top:[]}));
  const players = rank.players || rank.top || rank || [];
  const rows = (Array.isArray(players)?players:[]).slice(0,20).map((p,i)=>`
    <div class="list-item">
      <span>${i+1}. ${esc(p.full_name||p.name||'?')}</span>
      <span class="badge gold">⚡ ${Number(p.power||p.score||0).toLocaleString('fa-IR')}</span>
    </div>`).join('') || '<div class="empty">رتبه‌بندی در دسترس نیست</div>';
  const arows = (arena.top||[]).slice(0,10).map((p,i)=>`
    <div class="list-item"><span>${i+1}. ${esc(p.full_name||p.name||'?')}</span>
    <span class="badge">${esc(p.wins||p.score||'')}</span></div>`).join('');
  view.innerHTML = card('📊 رتبه‌بندی قدرت', rows) + (arows?card('⚔️ برترین آرنا', arows):'');
}

async function games(){
  view.innerHTML = card('🎮 بازی‌ها', `
    <div class="muted">مینی‌گیم‌ها از داخل ربات در دسترس‌اند:</div>
    <div class="list-item"><span>سنگ کاغذ قیچی</span><span class="badge">/rps</span></div>
    <div class="list-item"><span>تاس / تخته‌نرد</span><span class="badge">/dice</span></div>
    <div class="list-item"><span>شطرنج</span><span class="badge">/chess</span></div>
    <div class="list-item"><span>کازینو</span><span class="badge">/casino</span></div>
    <div class="empty">یا صفحه اختصاصی بازی‌ها را باز کن.</div>
  `) + `<div class="actions">${button('باز کردن games.html', "window.location.href='/app/static/games.html'", 'secondary')}</div>`;
}

async function admin(){
  try{
    const d = await api('/api/admin');
    view.innerHTML = card('🛡️ مدیریت', `
      ${row('کاربران', d.users||d.users_count||'-')}
      ${row('سفارشات باز', d.open_orders||'-')}
      ${row('نسخه', d.version||'-')}
    `) + `<div class="actions">${button('همگام‌سازی', "adminSync()")}</div>`;
  }catch(e){
    view.innerHTML = card('🛡️ مدیریت', `<div class="empty">${esc(e.message)}</div>`);
  }
}
async function adminSync(){
  try{ toast((await api('/api/admin/sync',{method:'POST'})).message||'OK'); }
  catch(e){ toast(e.message,false); }
}

render('home');
</script>
</body>
</html>
