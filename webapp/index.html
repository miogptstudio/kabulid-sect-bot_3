<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>۹ آسمان — دنیای فرقه</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/app/static/style.css">
</head>
<body>
<div id="app">
<header class="hero">
  <div class="brand">☁️ <b>۹ آسمان</b></div>
  <div id="heroSub">اَبَرجهانِ هزار-هزار-هزار-دنیا</div>
  <div class="hero-actions"><button class="iconbtn" onclick="refreshAll()">↻</button></div>
</header>
<div id="toast" class="toast"></div>
<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="home">🏠 خانه</button>
  <button class="tab" data-tab="world">🗺️ جهان</button>
  <button class="tab" data-tab="sect">🏯 فرقه</button>
  <button class="tab" data-tab="characters">🎭 کاراکتر</button>
  <button class="tab" data-tab="shop">🛒 فروشگاه</button>
  <button class="tab" data-tab="chests">🎁 گنجینه</button>
  <button class="tab" data-tab="arena">⚔️ نبرد</button>
  <button class="tab" data-tab="games">🎮 بازی</button>
  <button class="tab staff-only" data-tab="admin" hidden>🛡️ مدیریت</button>
</nav>
<main id="view"></main>
<footer>نسخه وب متصل به همان دیتابیس و منطق ربات</footer>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
try{tg?.setHeaderColor?.('#0b1020'); tg?.setBackgroundColor?.('#080c16');}catch(e){}
const tgUser=tg?.initDataUnsafe?.user||null;
const tgId=tgUser?.id||null;
const initData=tg?.initData||'';
const $=s=>document.querySelector(s);
const view=$('#view');
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
function toast(msg,ok=true){const t=$('#toast');t.textContent=msg;t.className='toast show '+(ok?'ok':'bad');clearTimeout(window._toast);window._toast=setTimeout(()=>t.className='toast',2800)}
async function api(path,opts={}){
  const o={...opts,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(opts.headers||{})}};
  let url=path; if(tgId) url+=(path.includes('?')?'&':'?')+'tg_id='+encodeURIComponent(tgId);
  const r=await fetch(url,o); let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok||j.error){throw new Error(j.error||j.message||'خطا در ارتباط با سرور')}; return j;
}
function row(a,b,cls=''){return `<div class="statrow ${cls}"><span>${esc(a)}</span><b>${esc(b)}</b></div>`}
function card(title,body,cls=''){return `<section class="card ${cls}"><h2>${title}</h2>${body}</section>`}
function button(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function requireTelegram(){if(!tgId){toast('مینی‌اپ را از داخل تلگرام باز کن',false);return false}return true}
function setTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render(tab)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b&&!b.hidden)setTab(b.dataset.tab)});

async function render(tab){
  view.innerHTML='<div class="loading">در حال بارگذاری…</div>';
  try{
    if(tab==='home')await home(); else if(tab==='world')await world(); else if(tab==='sect')await sect(); else if(tab==='characters')await characters(); else if(tab==='shop')await shop(); else if(tab==='chests')await chests(); else if(tab==='arena')await arena(); else if(tab==='games')games(); else if(tab==='admin')await admin();
  }catch(e){view.innerHTML=card('⚠️ خطا',`<p class="error">${esc(e.message)}</p>`);}
}
async function home(){
 const d=await api('/api/dashboard');
 $('#heroSub').textContent=`${d.sky_name} · 📍 (${d.world_x}, ${d.world_y})`;
 const w=d.wallet||{}; const c=d.cultivation||{};
 view.innerHTML=`<div class="hero-card"><div class="avatar">${esc((d.full_name||'پ')[0])}</div><div><h1>${esc(d.full_name)}</h1><p>${esc(d.rank)} · Lv.${d.level} · ${esc(c.realm||'بیداری')}</p></div><div class="power">⚡ ${Number(d.power||0).toLocaleString()}</div></div>
 ${card('📊 وضعیت',row('تذهیب',`${c.realm||'-'} · مرحله ${c.stage||1}`)+row('انرژی',c.energy||0)+row('فرقه',d.sect||'آزاد')+row('جهان',d.world||'-')+row('آسمان',d.sky||1)+row('مختصات',`(${d.world_x}, ${d.world_y})`)+row('🍖 گرسنگی',`${d.hunger}%`)+row('💧 تشنگی',`${d.thirst}%`))}
 ${card('💰 کیف پول',Object.entries(w).filter(([k,v])=>Number(v||0)!==0).map(([k,v])=>row(walletName(k),Number(v).toLocaleString())).join('')||row('سکه',0))}
 <div class="quick">${button('🎁 صندوق روزانه',"setTab('chests')")} ${button('🗺️ نقشه',"setTab('world')")} ${button('🎭 کاراکترها',"setTab('characters')")} ${button('🛒 فروشگاه',"setTab('shop')")}</div>`;
}
function walletName(k){return ({coins:'سکه',spirit_stones:'سنگ روحی',heavenly_stones:'سنگ بهشتی',celestial_stones:'سنگ آسمانی',god_stones:'سنگ خدا',chaos_stones:'سنگ هرج‌ومرج',void_stones:'سنگ پوچی',origin_stones:'سنگ ازلی',karma_points:'کارما',destiny_stones:'سنگ تقدیر',immortal_stones:'سنگ جاودان',creation_stones:'سنگ خلقت',absolute_stones:'سنگ مطلق',faith_stones:'سنگ ایمان',dragon_coins:'سکه اژدها',eternal_ink:'جوهر ازلی'}[k]||k)}

async function world(){
 const d=await api('/api/world'); const b=d.boss; const ev=d.event; const skies=d.skies||[];
 const cells=[]; for(let dy=4;dy>=-4;dy--)for(let dx=-4;dx<=4;dx++){const x=d.x+dx,y=d.y+dy;let cls=(dx===0&&dy===0)?'mapcell me':'';cells.push(`<div class="${cls}" title="(${x},${y})">${dx===0&&dy===0?'🧙':((Math.abs(x)+Math.abs(y))%17===0?'🏛️':((Math.abs(x)+Math.abs(y))%11===0?'🗿':'·'))}</div>`)}
 view.innerHTML=`${card(`☁️ آسمان ${d.sky}: ${esc(d.sky_name)}`,`<p class="lore">${esc(d.lore)}</p><div class="worldstats">${row('مختصات',`(${d.x}, ${d.y})`)}${row('مکان',d.landmark)}${row('شهر',d.city||'دشت ناشناخته')}${row('خطر',`${d.danger}%`)}</div>`)}
 ${card('🧭 حرکت',`<div class="compass"><button onclick="moveWorld('north')">⬆️<small>شمال</small></button><div><button onclick="moveWorld('west')">⬅️</button><button class="center">📍</button><button onclick="moveWorld('east')">➡️</button></div><button onclick="moveWorld('south')">⬇️<small>جنوب</small></button></div><p class="hint">حرکت از همین‌جا همان سیستم زمان/گرسنگی/تشنگی ربات را مصرف می‌کند.</p>`)}
 ${card('🗺️ نقشه زنده',`<div class="map">${cells.join('')}</div><p class="hint">هر خانه یک مختصات واقعی از جهان است؛ شهرها، رویدادها و باس‌ها روی مختصات قرار می‌گیرند.</p>`)}
 ${b?card('👑 باس مکان‌محور',`<div class="boss"><b>${esc(b.name)}</b><span>${Number(b.hp).toLocaleString()} / ${Number(b.max_hp).toLocaleString()}</span><small>📍 (${b.x}, ${b.y}) · فاز ${b.phase}</small></div>${button('⚔️ حمله به باس','bossAttack()','red')}`):''}
 ${ev?card('⚠️ رویداد جهان',`<b>${esc(ev.name)}</b><p>${esc(ev.desc)}</p><p>📍 (${ev.x}, ${ev.y})</p>`):''}
 ${card('🏙️ ساخت تمدن',`<input id="cityName" class="input" placeholder="نام شهر"><div>${button('ساخت شهر',"createCity()")}</div><input id="countryName" class="input" placeholder="نام کشور"><div>${button('ساخت کشور',"createCountry()",'gold')}</div><p class="hint">شهر از فاصله ۱۰ و کشور از فاصله ۲۰ خانه‌ای شهر آغازین قابل ساخت است.</p>`)}
 ${card('⬆️ صعود',`${button('🪜 چالش پلکان بهشت','challengeStair()')} ${button('☁️ ۹ آسمان','showSkies()')}<div id="skyList">${skies.map(s=>`<div class="minirow">${s.number}. ${esc(s.name)}</div>`).join('')}</div>`)}
 ${card('📍 مکان‌های مهم',`<div class="chips">${(d.landmarks||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div>`)}`;
}
async function moveWorld(dir){try{const d=await api('/api/action',{method:'POST',body:JSON.stringify({action:'move',direction:dir})});toast(d.message||'حرکت انجام شد');await world()}catch(e){toast(e.message,false)}}
async function createCity(){const n=$('#cityName')?.value?.trim();if(!n)return toast('نام شهر را وارد کن',false);try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'create_city',name:n})})).message);await world()}catch(e){toast(e.message,false)}}
async function createCountry(){const n=$('#countryName')?.value?.trim();if(!n)return toast('نام کشور را وارد کن',false);try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'create_country',name:n})})).message);await world()}catch(e){toast(e.message,false)}}
async function challengeStair(){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'heaven_stair'})})).message);await world()}catch(e){toast(e.message,false)}}
async function showSkies(){const d=await api('/api/world');toast(`آسمان فعلی: ${d.sky} — ${d.sky_name}`)}
async function bossAttack(){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'boss_attack'})})).message);await world()}catch(e){toast(e.message,false)}}

async function sect(){const d=await api('/api/sect');view.innerHTML=`${card('🏯 فرقه من',d.mine?row('نام',d.mine.name)+row('نوع',d.mine.sect_type)+row('قدرت رئیس',d.mine.leader_power)+row('قدرت فرقه',d.mine.power_level)+row('اعضا',d.mine.member_count)+row('فرقه مادر',d.mine.parent||'ندارد'):`<p class="muted">عضو فرقه نیستی.</p>`)}${card('🏆 فرقه‌های جهان',(d.all||[]).map((s,i)=>`<div class="rank-item"><span>${i+1}</span><div><b>${esc(s.name)}</b><small>${esc(s.sect_type)} · ${s.member_count} عضو · قدرت ${Number(s.power_level||0).toLocaleString()}</small></div></div>`).join('')||'خالی')}${card('⚔️ عملیات',d.mine?button('تازه‌سازی','sect()'):button('🏯 ساخت/پیدا کردن فرقه','toast(\'از سیستم فرقه ربات استفاده کن\')'))}`}

async function characters(){const d=await api('/api/characters');view.innerHTML=`${card('🎭 مجموعه کاراکتر',`<div class="charhead">${row('تعداد',d.characters.length)}${row('قدرت سه کاراکتر برتر',d.total_power)}</div>${button('✨ احضار کاراکتر','pullCharacter()')} ${button('🔀 ترکیب تکراری‌ها','mergeCharacters()')}`)}<div class="chargrid">${(d.characters||[]).map(c=>`<article class="char"><div class="rarity">${esc(c.emoji||'⭐')} ${esc(c.rarity)}</div><div class="portrait">${c.portrait?`<img src="/assets/characters/${esc(c.portrait)}" onerror="this.style.display='none'">`:''}<span>${esc((c.name||'؟')[0])}</span></div><b>${esc(c.name)}</b><small>${'⭐'.repeat(Math.min(5,c.stars||1))} · +${Number(c.power||0).toLocaleString()}</small><p>${esc(c.description||'')}</p></article>`).join('')}</div>`}
async function pullCharacter(){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'pull_character'})})).message);await characters()}catch(e){toast(e.message,false)}}
async function mergeCharacters(){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'merge_characters'})})).message);await characters()}catch(e){toast(e.message,false)}}

async function shop(){const d=await api('/api/shop');view.innerHTML=`<div class="shopfilter">${(d.buildings||[]).map(b=>`<button onclick="filterShop(${b.id})">${esc(b.name)}</button>`).join('')}</div><div id="shopItems">${shopItems(d.items||[])}</div>`}
function shopItems(items){return items.map(i=>`<article class="shopitem"><div><b>${esc(i.name)}</b><small>${esc(i.description||'')}</small></div><div class="price">💰 ${Number(i.price||0).toLocaleString()} ${esc(i.currency_name||'سکه')}</div><button class="btn" onclick="buyItem(${i.id})">خرید</button></article>`).join('')||'<p class="muted">فروشگاهی برای نمایش وجود ندارد.</p>'}
async function filterShop(id){try{const d=await api('/api/shop?building_id='+id);$('#shopItems').innerHTML=shopItems(d.items||[])}catch(e){toast(e.message,false)}}
async function buyItem(id){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'buy_item',item_id:id,qty:1})})).message);await shop()}catch(e){toast(e.message,false)}}

async function chests(){const d=await api('/api/chests');view.innerHTML=`${card('🎁 صندوق روزانه',row('وضعیت',d.cooldown?`⏳ ${d.cooldown}`:'آماده')+row('آخرین رتبه',d.last_grade||'—')+row('تعداد بازکردن',d.opened||0)+button('🎲 باز کردن صندوق روزانه','openDailyChest','gold'))}${card('🧰 فروش صندوق',`<div class="chestgrid">${(d.shop||[]).map(c=>`<article><b>${esc(c.rank)}</b><small>پاداش: ${Number(c.low).toLocaleString()} تا ${Number(c.high).toLocaleString()} سکه</small><strong>💰 ${Number(c.price).toLocaleString()}</strong><button class="btn" onclick="buyChest('${esc(c.rank)}')">خرید</button></article>`).join('')}</div>`)}${card('🍀 شانس',`<p>صندوق روزانه رتبه را بر اساس شانس تعیین می‌کند. رتبه‌های بالاتر نادرترند.</p>`)}`}
async function openDailyChest(){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'open_chest'})})).message);await chests()}catch(e){toast(e.message,false)}}
async function buyChest(rank){try{toast((await api('/api/action',{method:'POST',body:JSON.stringify({action:'buy_chest',grade:rank})})).message);await chests()}catch(e){toast(e.message,false)}}

async function arena(){const d=await api('/api/arena');view.innerHTML=card('⚔️ آرنا',`<p class="hint">نبردهای آرنا و امتیازها از همان پروفایل ربات خوانده می‌شوند.</p>${(d.top||[]).map((u,i)=>`<div class="rank-item"><span>${i+1}</span><div><b>${esc(u.full_name)}</b><small>${esc(u.tier)} · ${u.points} امتیاز · ${u.wins} برد</small></div></div>`).join('')}`)}
function games(){view.innerHTML=card('🎮 مرکز بازی',`<p>بازی‌های موجود: شطرنج، تخته‌نرد، سنگ‌کاغذقیچی، کازینو و حکم.</p>${button('باز کردن مرکز بازی','openGames()')}<p class="hint">اتاق‌های بازی وب از همان سرور ربات استفاده می‌کنند.</p>`)}
function openGames(){window.location.href='/app/games.html'}

async function admin(){const d=await api('/api/admin');view.innerHTML=`${card('🛡️ مدیریت',row('نقش',d.role)+row('بازیکنان',d.players)+row('بازیکنان فعال',d.active)+row('فرقه‌ها',d.sects))}${card('⚙️ عملیات امن',`<p class="hint">عملیات حساس ادمین فقط با احراز هویت Telegram WebApp و نقش مدیریتی قابل اجراست.</p>${button('🔄 همگام‌سازی داده‌ها','adminSync()')}`)}`}
async function adminSync(){try{toast((await api('/api/admin/sync',{method:'POST'})).message)}catch(e){toast(e.message,false)}}
async function refreshAll(){const active=$('.tab.active')?.dataset.tab||'home';await render(active)}
render('home');
</script>
</body></html>
