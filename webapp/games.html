<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>بازی‌ها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;background:#0f0f14;color:#eee;padding:12px;margin:0}
button{padding:10px 12px;margin:3px;border:0;border-radius:10px;background:#6c5ce7;color:#fff}
.card{background:#1a1a24;border-radius:14px;padding:12px;margin:10px 0}
.board{display:grid;grid-template-columns:repeat(8,minmax(28px,11vw));gap:2px;justify-content:center;max-width:360px;margin:auto}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#3d3d4f;font-size:clamp(16px,4.5vw,26px);cursor:pointer;border-radius:4px;user-select:none}
.cell.l{background:#5a5a6e}
.cell.sel{outline:2px solid #ffeaa7}
.cell.hl{background:#6c5ce788}
.nard{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pip{width:40px;height:40px;border-radius:8px;background:#2d3436;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<h2>🎮 بازی‌ها</h2>
<button onclick="show('chess')">♟️ شطرنج</button>
<button onclick="show('nard')">🎲 تخته‌نرد</button>
<button onclick="show('rps')">✊ سنگ‌کاغذ</button>
<button onclick="show('casino')">🎰 کازینو</button>
<div id="area" class="card"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const startPcs=()=>{
  const p=Array(64).fill('');
  const b=['♜','♞','♝','♛','♚','♝','♞','♜'];
  for(let i=0;i<8;i++){p[i]=b[i];p[8+i]='♟';p[48+i]='♙';p[56+i]=['♖','♘','♗','♕','♔','♗','♘','♖'][i];}
  return p;
};
let pcs=startPcs(), sel=null, turn='w';
function show(n){
  const a=document.getElementById('area');
  if(n==='chess'){
    a.innerHTML='<p>کلیک روی مهره، بعد خانه مقصد — مهره‌ها جابه‌جا می‌شوند</p><div class="board" id="cb"></div><p id="cm">نوبت: سفید</p><button onclick="pcs=startPcs();sel=null;turn=\'w\';draw()">ریست</button>';
    draw();
  } else if(n==='nard'){
    a.innerHTML=`<p>تخته‌نرد ساده — تاس بزن و امتیاز جمع کن (۳ دور)</p>
      <div class="nard"><div class="pip" id="d1">?</div><div class="pip" id="d2">?</div></div>
      <p id="ns">P1:0 | P2:0 | دور:0</p>
      <button onclick="nardRoll(1)">تاس بازیکن ۱</button>
      <button onclick="nardRoll(2)">تاس بازیکن ۲</button>`;
    window._ns={s:[0,0],r:[0,0]};
  } else if(n==='rps'){
    a.innerHTML='<button onclick="rps(\'سنگ\')">✊</button><button onclick="rps(\'کاغذ\')">✋</button><button onclick="rps(\'قیچی\')">✌</button><p id="ro"></p>';
  } else {
    a.innerHTML='<button onclick="cas()">🎰 بچرخان</button><p id="co"></p>';
  }
}
function draw(){
  const b=document.getElementById('cb'); if(!b)return; b.innerHTML='';
  pcs.forEach((pc,i)=>{
    const d=document.createElement('div');
    const light=((i%8)+(i/8|0))%2===0;
    d.className='cell'+(light?' l':'')+(sel===i?' sel':'');
    d.textContent=pc;
    d.onclick=()=>click(i);
    b.appendChild(d);
  });
  document.getElementById('cm').textContent='نوبت: '+(turn==='w'?'سفید':'سیاه');
}
function isWhite(pc){return '♙♖♘♗♕♔'.includes(pc)}
function isBlack(pc){return '♟♜♞♝♛♚'.includes(pc)}
function click(i){
  if(sel===null){
    if(!pcs[i])return;
    if(turn==='w'&&!isWhite(pcs[i]))return;
    if(turn==='b'&&!isBlack(pcs[i]))return;
    sel=i; draw(); return;
  }
  if(sel===i){sel=null;draw();return;}
  // move
  const me=pcs[sel];
  if(turn==='w'&&isWhite(pcs[i])){sel=i;draw();return;}
  if(turn==='b'&&isBlack(pcs[i])){sel=i;draw();return;}
  pcs[i]=me; pcs[sel]=''; sel=null; turn=turn==='w'?'b':'w'; draw();
}
function nardRoll(p){
  const st=window._ns; if(st.r[p-1]>=3)return;
  const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
  document.getElementById('d1').textContent=a;
  document.getElementById('d2').textContent=b;
  st.s[p-1]+=a+b; st.r[p-1]++;
  document.getElementById('ns').textContent=`P1:${st.s[0]} (${st.r[0]}/3) | P2:${st.s[1]} (${st.r[1]}/3)`;
  if(st.r[0]>=3&&st.r[1]>=3){
    const w=st.s[0]===st.s[1]?'مساوی':(st.s[0]>st.s[1]?'بازیکن ۱':'بازیکن ۲');
    document.getElementById('ns').textContent+=' → '+w;
  }
}
function rps(u){const o=['سنگ','کاغذ','قیچی'][Math.floor(Math.random()*3)];
  let r='مساوی';
  if((u==='سنگ'&&o==='قیچی')||(u==='کاغذ'&&o==='سنگ')||(u==='قیچی'&&o==='کاغذ'))r='برد';
  else if(u!==o)r='باخت';
  document.getElementById('ro').textContent=`تو:${u} ربات:${o} → ${r}`;
}
function cas(){const x=Math.floor(Math.random()*100);document.getElementById('co').textContent=x>95?'جکپات':x>70?'برد':x>40?'نزدیک':'باخت';}
show('chess');
</script>
</body>
</html>
