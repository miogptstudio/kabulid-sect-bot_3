<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>بازی‌ها</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;background:#0f0f14;color:#eee;padding:14px;margin:0}
button{padding:10px 14px;margin:4px;border:0;border-radius:10px;background:#6c5ce7;color:#fff}
.card{background:#1a1a24;border-radius:14px;padding:14px;margin:10px 0}
.board{display:grid;grid-template-columns:repeat(8,min(11vw,36px));gap:2px;justify-content:center}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#333;font-size:18px}
.cell.l{background:#444}
</style>
</head>
<body>
<h2>🎮 بازی‌ها</h2>
<button onclick="show('chess')">شطرنج</button>
<button onclick="show('nard')">تخته‌نرد</button>
<button onclick="show('rps')">سنگ‌کاغذ‌قیچی</button>
<button onclick="show('casino')">کازینو</button>
<div id="area" class="card"></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
function show(n){
  const a=document.getElementById('area');
  if(n==='chess'){
    const pcs=['♜','♞','♝','♛','♚','♝','♞','♜','♟','♟','♟','♟','♟','♟','♟','♟',...Array(32).fill(''),'♙','♙','♙','♙','♙','♙','♙','♙','♖','♘','♗','♕','♔','♗','♘','♖'];
    let h='<div class="board">';
    for(let i=0;i<64;i++) h+=`<div class="cell${((i%8)+(i/8|0))%2?'':' l'}">${pcs[i]||''}</div>`;
    a.innerHTML=h+'</div><p>نسخه نمایشی شطرنج</p>';
  } else if(n==='nard'){
    const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);
    a.innerHTML=`<p style="font-size:2rem">🎲 ${d1} — ${d2}</p>`;
  } else if(n==='rps'){
    a.innerHTML='<p>انتخاب کن:</p><button onclick="rps(\'سنگ\')">✊</button><button onclick="rps(\'کاغذ\')">✋</button><button onclick="rps(\'قیچی\')">✌</button><p id="rpsOut"></p>';
  } else {
    a.innerHTML='<p>کازینو — شانس:</p><button onclick="casino()">🎰 بچرخان</button><p id="casOut"></p>';
  }
}
function rps(u){
  const opts=['سنگ','کاغذ','قیچی']; const b=opts[Math.floor(Math.random()*3)];
  let r='مساوی';
  if(u===b)r='مساوی';
  else if((u==='سنگ'&&b==='قیچی')||(u==='کاغذ'&&b==='سنگ')||(u==='قیچی'&&b==='کاغذ'))r='برد!';
  else r='باخت';
  document.getElementById('rpsOut').textContent=`تو: ${u} | ربات: ${b} → ${r}`;
}
function casino(){
  const x=Math.floor(Math.random()*100);
  document.getElementById('casOut').textContent=x>95?'💎 جکپات!':x>70?'🪙 برد کوچک':x>40?'تقریباً':'💀 باخت';
}
show('chess');
</script>
</body>
</html>
